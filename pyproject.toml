[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowguide"
version = "0.3.0"
description = "Local-first, advisory-only AI terminal companion that explains commands for your OS and shell."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-cov>=5", "hypothesis>=6.100",
    "ruff>=0.6", "mypy>=1.10", "bandit>=1.7", "pip-audit>=2.7", "build>=1.2", "twine>=5",
]

[project.scripts]
shadowguide = "shadowguide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shadowguide = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "SIM", "RET", "PLE", "PLW", "C4", "PIE", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S310", "B011", "RUF100"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["shadowguide"]
branch = true

[tool.coverage.report]
fail_under = 92
show_missing = true
