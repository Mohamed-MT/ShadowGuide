name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dev dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Tests, fuzzing and coverage gate
        run: python -m pytest -q --cov

  quality:
    name: lint, types, security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Ruff (correctness, bugbear, security rules)
        run: ruff check src tests
      - name: mypy --strict
        run: mypy
      - name: Bandit
        run: bandit -q -r src -c pyproject.toml
      - name: Known-vulnerability scan of dev dependencies
        run: pip-audit -r requirements-dev.lock --require-hashes --progress-spinner off

  package:
    name: build and verify distribution
    runs-on: ubuntu-latest
    needs: [test, quality]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python scripts/check_dist.py dist
      - name: Install the wheel into a clean environment and smoke test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/shadowguide --version
          /tmp/clean/bin/shadowguide risk rm -rf / | grep -q CRITICAL
          # the product has no runtime dependencies: nothing but itself and pip may be installed
          test "$(/tmp/clean/bin/pip list --format=freeze | grep -vcE '^(shadowguide|pip)==')" = "0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
